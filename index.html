<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>timedle</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-alpha.1/dist/leaflet.css"
     integrity="sha256-P+hWJNlpL+GBSRYC7cdsDbQH91URmpDeOzLp7DbFRtE="
     crossorigin=""/>
    <script type="importmap">
    {
        "imports": {
            "leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-alpha.1/dist/leaflet.js"
        },
        "integrity": {
            "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-alpha.1/dist/leaflet.js": "sha256-gj5JhNAaMi6LCs+jVFOk8sXDe1sWSS2Zlc87m+trLiQ="
        }
    }
    </script>
</head>
<body>
    <div class="container">
        <div class="top">
            <span class="damek">damek.net</span>
            <h1 class="logo">timedle</h1>
            <span class="game-id">#1</span>
        </div>
        <div class="time-section">
            <div class="time-info">
                <span class="time-label">local time:</span>
                <h2 id="clock">00:00</h2>
            </div>
            <div id="time-icon"></div>
        </div>
        <div class="map">
            <div id="map"></div>
            <button id="guess-btn">guess</button>
        </div>
    </div>
    <script src="./script.js" type="module"></script>

</body>
</html>
