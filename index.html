<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>timedle</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.13.0/dist/maplibre-gl.css" />
</head>
<body>
    <div class="container">
        <div class="modal">
            <div id="win" class="winlose hidden">
                <h2>congratulations!</h2>
                <p>you guessed it correctly!</p>
                <buttton class="play-again">Play Again</button>
            </div>
            <div id="lose" class="winlose hidden">
                <h2>you lose!</h2>
                <p>better luck next time!</p>
                <buttton class="play-again">Play Again</button>
            </div>
        </div>
        <div class="top">
            <span class="damek">damek.net</span>
            <h1 class="logo">timedle</h1>
            <span class="game-guess">
                <p>Guess:</p> 
                <p>
                    <span id="remaining-guesses">0</span>/5
                </p>            
            </span>
        </div>
        <div class="time-section">
            <div class="time-info">
                <span class="time-label">guess the country where it is:</span>
                <h2 id="clock">00:00</h2>
            </div>
            <div id="time-icon"></div>
        </div>
        <div class="map">
            <div class="selected"><p>Selected: <span id="selected-country">none</span></p></div>
            <div id="map"></div>
        </div>
        <button id="guess-btn">guess</button>
        <div class="history-section">
            <h3>history</h3>
            <div class="guess-history"  id="guess-history">
                <p>nothing to show yet, guess something first :)</p>
            </div>
        </div>
    </div>
    <script src="./script.js" type="module"></script>
</body>
</html>
