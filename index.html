<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>timedle</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <div class="top">
            <h3 class="logo">timedle</h3>
            <p>guess the country based on the local time</p>
        </div>
        <div class="game">
            <div class="time-show">
                <p>time right now:</p>
                <h2>00:00</h2>
            </div>
            <div class="chooser">
                <div class="map" id="map">
                    <p class="info">will show a map where users can choose a country and submit their gguesses here</p>
                </div>
            </div> 
        </div>
    </div>
</body>
</html>
