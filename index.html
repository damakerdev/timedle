<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>timedle</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.13.0/dist/maplibre-gl.css" />
</head>
<body>
    <div class="container">
        <div class="top">
            <span class="damek">damek.net</span>
            <h1 class="logo">timedle</h1>
            <span class="game-id">#1</span>
        </div>
        <div class="time-section">
            <div class="time-info">
                <span class="time-label">local time:</span>
                <h2 id="clock">00:00</h2>
            </div>
            <div id="time-icon"></div>
        </div>
        <div class="map">
            <div id="map"></div>
            <button id="guess-btn">guess</button>
        </div>
    </div>
    <script type="module" src="https://unpkg.com/maplibre-gl@^6.13.0/dist/maplibre-gl.mjs"></script>
    <script src="./script.js" type="module"></script>
</body>
</html>
